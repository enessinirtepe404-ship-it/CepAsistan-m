<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cep Asistanım</title>
<style>
* {
    box-sizing: border-box;
}
:root {
    --bg: #0b0b0f;
    --card: #15151c;
    --card2: #1d1d26;
    --text: #ffffff;
    --muted: #9a9aa5;
    --border: #292933;
    --button: #ffffff;
    --buttonText: #111111;
}
body.light {
    --bg: #f2f3f7;
    --card: #ffffff;
    --card2: #f0f1f5;
    --text: #111111;
    --muted: #666673;
    --border: #ddddE5;
    --button: #111111;
    --buttonText: #ffffff;
}
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: 0.3s;
}
.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 22px 16px 30px;
}
.header {
    text-align: center;
    padding: 15px 0 25px;
}
.logo {
    width: 70px;
    height: 70px;
    margin: auto;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    background: linear-gradient(135deg, #ffffff, #777777);
    color: #111;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}
h1 {
    margin: 15px 0 5px;
    font-size: 30px;
    letter-spacing: -1px;
}
.subtitle {
    color: var(--muted);
    font-size: 15px;
}
.theme {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}
.theme button {
    width: auto;
    padding: 10px 18px;
    margin: 0;
    border-radius: 20px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 14px;
}
.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 21px;
    margin-bottom: 17px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}
.card h2 {
    margin: 0 0 17px;
    font-size: 20px;
}
input {
    width: 100%;
    padding: 15px;
    margin: 6px 0;
    border-radius: 13px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--text);
    outline: none;
    font-size: 16px;
}
input:focus {
    border-color: #777;
}
.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 8px;
}
button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 13px;
    font-size: 15px;
    font-weight: 700;
    background: var(--button);
    color: var(--buttonText);
    cursor: pointer;
    transition: 0.2s;
}
button:active {
    transform: scale(0.97);
}
.result {
    margin-top: 15px;
    padding: 17px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-align: center;
    font-size: 17px;
    line-height: 1.5;
}
.footer {
    text-align: center;
    color: var(--muted);
    margin-top: 25px;
    font-size: 13px;
}
@media (max-width: 380px) {
    h1 {
        font-size: 26px;
    }
    .card {
        padding: 17px;
    }
    .actions {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">⚡</div>
        <h1>Cep Asistanım</h1>
        <div class="subtitle">
            Günlük hayatını kolaylaştır
        </div>
    </div>
    <div class="theme">
        <button onclick="temaDegistir()" id="temaButonu">
            🌙 Karanlık Mod
        </button>
    </div>
    <div class="card">
        <h2>🧮 Hesap Makinesi</h2>
        <input id="sayi1" type="number" placeholder="Birinci sayı">
        <input id="sayi2" type="number" placeholder="İkinci sayı">
        <div class="actions">
            <button onclick="topla()">➕ Topla</button>
            <button onclick="cikar()">➖ Çıkar</button>
            <button onclick="carp()">✖️ Çarp</button>
            <button onclick="bol()">➗ Böl</button>
        </div>
        <div class="result" id="hesapSonuc">
            Sonuç burada görünecek
        </div>
    </div>
    <div class="card">
        <h2>🚗 Yakıt Hesaplayıcı</h2>
        <input id="mesafe" type="number" placeholder="Kaç km gittin?">
        <input id="yakit" type="number" placeholder="Kaç litre yaktın?">
        <input id="fiyat" type="number" placeholder="Litre fiyatı (TL)">
        <button onclick="yakitHesapla()">
            ⛽ Yakıtı Hesapla
        </button>
        <div class="result" id="yakitSonuc">
            Sonuç burada görünecek
        </div>
    </div>
    <div class="footer">
        Cep Asistanım • 2026
    </div>
</div>
<script>
function sayilariAl() {
    let a = Number(document.getElementById("sayi1").value);
    let b = Number(document.getElementById("sayi2").value);
    return [a, b];
}
function topla() {
    let [a, b] = sayilariAl();
    document.getElementById("hesapSonuc").innerText =
        "Sonuç: " + (a + b);
}
function cikar() {
    let [a, b] = sayilariAl();
    document.getElementById("hesapSonuc").innerText =
        "Sonuç: " + (a - b);
}
function carp() {
    let [a, b] = sayilariAl();
    document.getElementById("hesapSonuc").innerText =
        "Sonuç: " + (a * b);
}
function bol() {
    let [a, b] = sayilariAl();
    if (b === 0) {
        document.getElementById("hesapSonuc").innerText =
            "Sıfıra bölme yapılamaz.";
        return;
    }
    document.getElementById("hesapSonuc").innerText =
        "Sonuç: " + (a / b);
}
function yakitHesapla() {
    let mesafe =
        Number(document.getElementById("mesafe").value);
    let yakit =
        Number(document.getElementById("yakit").value);
    let fiyat =
        Number(document.getElementById("fiyat").value);
    if (mesafe <= 0 || yakit <= 0 || fiyat <= 0) {
        document.getElementById("yakitSonuc").innerText =
            "Lütfen tüm bilgileri gir.";
        return;
    }
    let tuketim = (yakit / mesafe) * 100;
    let maliyet = yakit * fiyat;
    document.getElementById("yakitSonuc").innerHTML =
        "⛽ 100 km'de: <b>" +
        tuketim.toFixed(2) +
        " litre</b><br><br>" +
        "💰 Toplam yakıt maliyeti: <b>" +
        maliyet.toFixed(2) +
        " TL</b>";
}
function temaDegistir() {
    document.body.classList.toggle("light");
    let buton =
        document.getElementById("temaButonu");
    if (document.body.classList.contains("light")) {
        buton.innerText = "☀️ Aydınlık Mod";
    } else {
        buton.innerText = "🌙 Karanlık Mod";
    }
}
</script>
</body>
</html>
