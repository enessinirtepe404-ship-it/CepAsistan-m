<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cep Asistanım</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    transition: 0.3s;
}

body.light {
    background: #f1f5f9;
    color: #0f172a;
}

header {
    text-align: center;
    padding: 35px 15px 20px;
}

.logo {
    font-size: 34px;
    font-weight: bold;
}

.subtitle {
    color: #94a3b8;
    margin-top: 8px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.theme-btn {
    display: block;
    margin: 0 auto 25px;
    padding: 10px 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: #334155;
    color: white;
    font-size: 15px;
}

body.light .theme-btn {
    background: #cbd5e1;
    color: #0f172a;
}

.menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 25px;
}

.menu button {
    border: none;
    border-radius: 18px;
    padding: 22px 10px;
    background: #1e293b;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

.menu button:hover {
    transform: translateY(-3px);
    background: #334155;
}

body.light .menu button {
    background: white;
    color: #0f172a;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.tool {
    display: none;
    background: #1e293b;
    padding: 22px;
    border-radius: 20px;
    margin-bottom: 20px;
}

.tool.active {
    display: block;
}

body.light .tool {
    background: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.tool h2 {
    margin-top: 0;
}

input, select {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    border-radius: 10px;
    border: 1px solid #475569;
    background: #0f172a;
    color: white;
    font-size: 16px;
}

body.light input,
body.light select {
    background: #f8fafc;
    color: #0f172a;
    border-color: #cbd5e1;
}

.action {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.action:hover {
    background: #1d4ed8;
}

.result {
    margin-top: 15px;
    padding: 13px;
    border-radius: 10px;
    background: #0f172a;
    min-height: 20px;
}

body.light .result {
    background: #f1f5f9;
}

.back {
    background: #475569;
    margin-top: 10px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

@media (max-width: 500px) {
    .menu {
        grid-template-columns: 1fr 1fr;
    }

    .logo {
        font-size: 29px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">⚡ Cep Asistanım</div>
    <div class="subtitle">Günlük hayatını kolaylaştır</div>
</header>

<div class="container">

<button class="theme-btn" onclick="temaDegistir()" id="themeButton">
    🌙 Karanlık Mod
</button>

<!-- ANA MENÜ -->
<div class="menu" id="menu">

    <button onclick="ac('hesap')">
        🧮<br><br>Hesap Makinesi
    </button>

    <button onclick="ac('yakit')">
        🚗<br><br>Yakıt Hesaplayıcı
    </button>

    <button onclick="ac('yas')">
        🎂<br><br>Yaş Hesaplama
    </button>

    <button onclick="ac('birim')">
        📏<br><br>Birim Dönüştürücü
    </button>

    <button onclick="ac('yuzde')">
        📊<br><br>Yüzde Hesaplama
    </button>

    <button onclick="ac('kdv')">
        🧾<br><br>KDV Hesaplama
    </button>

</div>


<!-- HESAP MAKİNESİ -->
<div class="tool" id="hesap">

<h2>🧮 Hesap Makinesi</h2>

<input type="number" id="sayi1" placeholder="1. sayı">
<input type="number" id="sayi2" placeholder="2. sayı">

<button class="action" onclick="hesapla('+')">➕ Topla</button>
<button class="action" onclick="hesapla('-')">➖ Çıkar</button>
<button class="action" onclick="hesapla('*')">✖️ Çarp</button>
<button class="action" onclick="hesapla('/')">➗ Böl</button>

<div class="result" id="hesapSonuc"></div>

<button class="action back" onclick="anaMenu()">← Ana Menü</button>

</div>


<!-- YAKIT -->
<div class="tool" id="yakit">

<h2>🚗 Yakıt Hesaplayıcı</h2>

<input type="number" id="mesafe" placeholder="Kaç km gittin?">
<input type="number" id="yakitMiktar" placeholder="Kaç litre yakıt harcadın?">
<input type="number" id="litreFiyat" placeholder="1 litre yakıt kaç TL?">

<button class="action" onclick="yakitHesapla()">
    Hesapla
</button>

<div class="result" id="yakitSonuc"></div>

<button class="action back" onclick="anaMenu()">← Ana Menü</button>

</div>


<!-- YAŞ -->
<div class="tool" id="yas">

<h2>🎂 Yaş Hesaplama</h2>

<input type="date" id="dogumTarihi">

<button class="action" onclick="yasHesapla()">
    Yaşımı Hesapla
</button>

<div class="result" id="yasSonuc"></div>

<button class="action back" onclick="anaMenu()">← Ana Menü</button>

</div>


<!-- BİRİM -->
<div class="tool" id="birim">

<h2>📏 Birim Dönüştürücü</h2>

<input type="number" id="birimDeger" placeholder="Değer gir">

<select id="birimSec">
    <option value="km-mil">Kilometre → Mil</option>
    <option value="mil-km">Mil → Kilometre</option>
    <option value="kg-lb">Kilogram → Pound</option>
    <option value="lb-kg">Pound → Kilogram</option>
    <option value="c-f">Celsius → Fahrenheit</option>
    <option value="f-c">Fahrenheit → Celsius</option>
</select>

<button class="action" onclick="birimHesapla()">
    Dönüştür
</button>

<div class="result" id="birimSonuc"></div>

<button class="action back" onclick="anaMenu()">← Ana Menü</button>

</div>


<!-- YÜZDE -->
<div class="tool" id="yuzde">

<h2>📊 Yüzde Hesaplama</h2>

<input type="number" id="yuzdeSayi" placeholder="Sayı">
<input type="number" id="yuzdeOran" placeholder="Yüzde oranı">

<button class="action" onclick="yuzdeHesapla()">
    Hesapla
</button>

<div class="result" id="yuzdeSonuc"></div>

<button class="action back" onclick="anaMenu()">← Ana Menü</button>

</div>


<!-- KDV -->
<div class="tool" id="kdv">

<h2>🧾 KDV Hesaplama</h2>

<input type="number" id="kdvTutar" placeholder="Tutar (TL)">

<select id="kdvOran">
    <option value="20">%20 KDV</option>
    <option value="10">%10 KDV</option>
    <option value="1">%1 KDV</option>
</select>

<button class="action" onclick="kdvHesapla()">
    Hesapla
</button>

<div class="result" id="kdvSonuc"></div>

<button class="action back" onclick="anaMenu()">← Ana Menü</button>

</div>

</div>

<footer>
    Cep Asistanım • 2026
</footer>


<script>

function ac(id) {
    document.getElementById("menu").style.display = "none";

    document.querySelectorAll(".tool").forEach(function(tool) {
        tool.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}

function anaMenu() {
    document.querySelectorAll(".tool").forEach(function(tool) {
        tool.classList.remove("active");
    });

    document.getElementById("menu").style.display = "grid";
}


function hesapla(islem) {

    let a = Number(document.getElementById("sayi1").value);
    let b = Number(document.getElementById("sayi2").value);

    if (isNaN(a) || isNaN(b)) {
        document.getElementById("hesapSonuc").innerText =
            "Lütfen iki sayı da gir.";
        return;
    }

    let sonuc;

    if (islem === "+") sonuc = a + b;
    if (islem === "-") sonuc = a - b;
    if (islem === "*") sonuc = a * b;

    if (islem === "/") {
        if (b === 0) {
            document.getElementById("hesapSonuc").innerText =
                "Sıfıra bölme yapılamaz.";
            return;
        }

        sonuc = a / b;
    }

    document.getElementById("hesapSonuc").innerText =
        "Sonuç: " + sonuc;
}


function yakitHesapla() {

    let mesafe = Number(document.getElementById("mesafe").value);
    let yakit = Number(document.getElementById("yakitMiktar").value);
    let fiyat = Number(document.getElementById("litreFiyat").value);

    if (mesafe <= 0 || yakit <= 0 || fiyat <= 0) {
        document.getElementById("yakitSonuc").innerText =
            "Lütfen tüm alanları doğru doldur.";
        return;
    }

    let tuketim = (yakit / mesafe) * 100;
    let maliyet = yakit * fiyat;

    document.getElementById("yakitSonuc").innerHTML =
        "⛽ 100 km'de: " + tuketim.toFixed(2) + " litre<br>" +
        "💰 Toplam yakıt maliyeti: " + maliyet.toFixed(2) + " TL";
}


function yasHesapla() {

    let dogum = document.getElementById("dogumTarihi").value;

    if (!dogum) {
        document.getElementById("yasSonuc").innerText =
            "Lütfen doğum tarihini seç.";
        return;
    }

    let dogumTarihi = new Date(dogum);
    let bugun = new Date();

    let yas = bugun.getFullYear() - dogumTarihi.getFullYear();

    let ay = bugun.getMonth() - dogumTarihi.getMonth();

    if (
        ay < 0 ||
        (ay === 0 && bugun.getDate() < dogumTarihi.getDate())
    ) {
        yas--;
    }

    document.getElementById("yasSonuc").innerText =
        "🎉 Yaşın: " + yas;
}


function birimHesapla() {

    let deger = Number(document.getElementById("birimDeger").value);
    let secim = document.getElementById("birimSec").value;

    if (isNaN(deger)) {
        document.getElementById("birimSonuc").innerText =
            "Lütfen bir değer gir.";
        return;
    }

    let sonuc;
    let birim;

    if (secim === "km-mil") {
        sonuc = deger * 0.621371;
        birim = "mil";
    }

    if (secim === "mil-km") {
        sonuc = deger * 1.60934;
        birim = "km";
    }

    if (secim === "kg-lb") {
        sonuc = deger * 2.20462;
        birim = "lb";
    }

    if (secim === "lb-kg") {
        sonuc = deger * 0.453592;
        birim = "kg";
    }

    if (secim === "c-f") {
        sonuc = (deger * 9 / 5) + 32;
        birim = "°F";
    }

    if (secim === "f-c") {
        sonuc = (deger - 32) * 5 / 9;
        birim = "°C";
    }

    document.getElementById("birimSonuc").innerText =
        "Sonuç: " + sonuc.toFixed(2) + " " + birim;
}


function yuzdeHesapla() {

    let sayi = Number(document.getElementById("yuzdeSayi").value);
    let oran = Number(document.getElementById("yuzdeOran").value);

    if (isNaN(sayi) || isNaN(oran)) {
        document.getElementById("yuzdeSonuc").innerText =
            "Lütfen iki alanı da doldur.";
        return;
    }

    let sonuc = sayi * oran / 100;

    document.getElementById("yuzdeSonuc").innerText =
        "%" + oran + " = " + sonuc;
}


function kdvHesapla() {

    let tutar = Number(document.getElementById("kdvTutar").value);
    let oran = Number(document.getElementById("kdvOran").value);

    if (tutar <= 0) {
        document.getElementById("kdvSonuc").innerText =
            "Lütfen geçerli bir tutar gir.";
        return;
    }

    let kdv = tutar * oran / 100;
    let toplam = tutar + kdv;

    document.getElementById("kdvSonuc").innerHTML =
        "KDV: " + kdv.toFixed(2) + " TL<br>" +
        "KDV dahil toplam: " + toplam.toFixed(2) + " TL";
}


function temaDegistir() {

    document.body.classList.toggle("light");

    let buton = document.getElementById("themeButton");

    if (document.body.classList.contains("light")) {
        buton.innerText = "🌙 Karanlık Mod";
    } else {
        buton.innerText = "☀️ Aydınlık Mod";
    }
}

</script>

</body>
</html>
