<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cep Asistanım</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 25px 18px;
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.card {
    background: #1e1e1e;
    border-radius: 18px;
    padding: 25px 15px;
    text-align: center;
    font-size: 18px;
    border: 1px solid #333;
}

.icon {
    font-size: 35px;
    display: block;
    margin-bottom: 10px;
}

.footer {
    text-align: center;
    color: #777;
    margin-top: 30px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ Cep Asistanım</h1>

<div class="subtitle">
Günlük hayatını kolaylaştır
</div>

<div class="grid">

<div class="card">
<span class="icon">🧮</span>
Hesap Makinesi
</div>

<div class="card">
<span class="icon">💰</span>
Harcama Takibi
</div>

<div class="card">
<span class="icon">🚗</span>
Araç Asistanı
</div>

<div class="card">
<span class="icon">🔐</span>
Şifre Oluştur
</div>

<div class="card">
<span class="icon">⏱️</span>
Sayaç
</div>

<div class="card">
<span class="icon">📋</span>
Notlar
</div>

</div>

<div class="footer">
Cep Asistanım • 2026
</div>

</div>

</body>
</html>
